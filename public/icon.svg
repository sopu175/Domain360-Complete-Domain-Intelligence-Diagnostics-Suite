<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="domain360-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#domain360-grad)" />

  <!-- Outer Orbit / 360 Ring -->
  <circle cx="32" cy="32" r="22" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="4 3" />
  
  <!-- Globe Center Circle -->
  <circle cx="32" cy="32" r="15" stroke="#FFFFFF" stroke-width="2.75" fill="none" />
  
  <!-- Latitude Line (Equator) -->
  <path d="M17 32h30" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Meridian Ellipse -->
  <ellipse cx="32" cy="32" rx="7" ry="15" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
  
  <!-- 360 Orbit Ping Node -->
  <circle cx="48" cy="18" r="3.5" fill="#34D399" stroke="#FFFFFF" stroke-width="1.5" />
</svg>

